# This is a Spack Environment file.
#
# It describes a set of packages to be installed, along with
# configuration settings.

spack:
  specs:
    - lfric-meta@2.2 ^xios ^blitz%cce_all ^boost%cce_all %cce_all
    - lfric-meta@3.0 ^xios ^blitz%gcc_all ^boost%gcc_all %gcc_all
    - pfunit +mpi +openmp %gcc_all
    # - pfunit +mpi +openmp %cce_all
    - fcm %gcc ^perl-tk cflags="-Wno-error=incompatible-pointer-types -Wno-error=implicit-int" ^apr cflags="-Wno-error=incompatible-pointer-types -Wno-error=implicit-int"
    - rose-picker
#  - hpctoolkit
#  - hpcviewer
  concretizer:
    unify: false
    splice::
      automatic: false
  config:
    install_tree:
      root: /work/d435/d435/lparisid435/met-lfric-cirrus/opt
      padding_length: 120
  repos:
    metoffice: /work/d435/d435/lparisid435/met-lfric-cirrus/repos/metoffice/spack_repo/metoffice

  view: false
